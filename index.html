<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ОБЛАКА — редактор хромового облака</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
html,body{height:100%}
body{margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#14141a,#0a0a0e 45%,#040406);font-family:Montserrat,sans-serif}
#s{position:fixed;inset:0;touch-action:none}
#s canvas{display:block;opacity:0;transition:opacity 1.5s}
#s canvas.r{opacity:1}
.b{position:fixed;left:0;right:0;bottom:7vh;text-align:center;pointer-events:none;user-select:none}
.b h1{margin:0;font-weight:200;white-space:nowrap;font-size:clamp(2rem,5.5vw,4.2rem);letter-spacing:.48em;padding-left:.48em;color:#e9eaee;text-shadow:0 0 30px rgba(255,255,255,.15)}
.b p{margin:1.1em 0 0;font-weight:300;font-size:clamp(.6rem,1.4vw,.9rem);letter-spacing:.78em;padding-left:.78em;color:#8b909a}
#tb{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgba(13,15,20,.82);border:1px solid #232833;border-radius:999px;z-index:5;backdrop-filter:blur(6px)}
#tb button{font:300 11px Montserrat,sans-serif;letter-spacing:.14em;color:#c8ccd4;background:#1a1d25;border:1px solid #262b36;border-radius:999px;padding:7px 14px;cursor:pointer}
#tb button:hover{background:#23262f;color:#fff}
#bPlay{border-color:#3f5f8f;color:#a8c6ff}
#bPlay.on{border-color:#8f7a3f;color:#ffd9a0}
#tb .sz{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;color:#8b909a}
#sz{width:90px;accent-color:#a8c6ff}
#e{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:90vw;padding:8px 16px;border-radius:6px;background:rgba(40,8,8,.85);border:1px solid #7a2a2a;color:#f0b9b9;font-size:12px;z-index:9;text-align:center}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.5) 100%)}
.lil-gui.root{--background-color:#0d0f14;--text-color:#c8ccd4;--title-background-color:#14161d;--title-text-color:#e9eaee;--widget-color:#1a1d25;--hover-color:#23262f;--focus-color:#2a2f3c;--number-color:#a8c6ff;--string-color:#a8c6ff;--font-family:Montserrat,sans-serif;--font-size:11px;--input-font-size:11px;--name-width:52%;border:1px solid #20242e;border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.lil-gui.root .title{letter-spacing:.22em;font-weight:300}
</style>
</head>
<body>
<div id="s"></div>
<div id="tb">
  <button id="bAdd">+ ШАР</button>
  <button id="bDel">− ШАР</button>
  <div class="sz"><span>размер</span><input id="sz" type="range" min="0.3" max="3" step="0.05" value="1.2"></div>
  <button id="bPlay">▶ ПУСК</button>
</div>
<div class="b"><h1>ОБЛАКА</h1><p>ЖИЛОЙ КОМПЛЕКС</p></div>
<div id="e"></div>
<script>
window.ok=false;window.err=false;
function msg(t){window.err=true;var e=document.getElementById('e');e.textContent=t;e.style.display='block'}
window.addEventListener('error',function(ev){msg('Ошибка: '+(ev&&ev.message||'неизвестная')+' — если SyntaxError, файл скопирован не полностью: последняя строка должна быть </html>')});
setTimeout(function(){if(!window.ok&&!window.err)msg('CDN отвечает медленно — пробую зеркала (jsdelivr → unpkg → esm.sh), подождите…')},7000);
</script>
<script type="module">
const M=[
{t:'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',m:'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/objects/MarchingCubes.js',g:'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js',r:1},
{t:'https://unpkg.com/three@0.160.0/build/three.module.js',m:'https://unpkg.com/three@0.160.0/examples/jsm/objects/MarchingCubes.js',g:'https://unpkg.com/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js',r:1},
{t:'https://esm.sh/three@0.160.0',m:'https://esm.sh/three@0.160.0/examples/jsm/objects/MarchingCubes.js',g:'https://esm.sh/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js'}];
const T=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj('таймаут'),ms))]);
async function L(u,base){
const res=await T(fetch(u),15000);if(!res.ok)throw'HTTP '+res.status;
let s=await res.text();s=s.replace(/(from\s*)(['"])three\2/g,(mm,p,q)=>p+q+base+q);
const b=URL.createObjectURL(new Blob([s],{type:'text/javascript'}));
try{return await import(b)}finally{URL.revokeObjectURL(b)}}
let lib=null,why=[];
for(const c of M){try{
const THREE=await T(import(c.t),15000);
const a=await(c.r?L(c.m,c.t):T(import(c.m),15000));
const b=await(c.r?L(c.g,c.t):T(import(c.g),15000));
lib={THREE,MC:a.MarchingCubes,GUI:b.GUI};break
}catch(e){why.push(e)}}
if(!lib)msg('three.js не загрузился ('+why.join(' | ')+'). Проверьте интернет; файл открывать двойным кликом, не в предпросмотре.');
else main(lib.THREE,lib.MC,lib.GUI);

function main(THREE,MarchingCubes,GUI){
const P={goo:.75,spin:matchMedia('(prefers-reduced-motion: reduce)').matches?.01:.03,env:'meadow',morph:1,wave:.26,rough:.09,yank:7,back:1.6,rx:.46,ry:.4,rz:.3,room:false};
const box=document.getElementById('s'),small=Math.min(innerWidth,innerHeight)<640;
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
box.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,80),CT=new THREE.Vector3(0,.08,0);
let cd=6,ca=.6,cp=.28,playing=false;

/* отражения */
const CL=[[200,320,95],[680,390,70],[1130,280,115],[1640,370,84],[1920,320,92],[410,450,60],[920,440,66],[1390,470,56],[80,400,72],[1230,340,60]];
function paint(k){
const c=document.createElement('canvas');c.width=2048;c.height=1024;const x=c.getContext('2d');
const gr=s=>{const g=x.createLinearGradient(0,0,0,1024);s.forEach(([p,q])=>g.addColorStop(p,q));x.fillStyle=g;x.fillRect(0,0,2048,1024)};
const gl=(px,py,r,a,b)=>{const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,a);g.addColorStop(.3,b);g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(px-r,py-r,2*r,2*r)};
const cl=(px,py,r,q)=>{for(let i=0;i<5;i++){const X=px+(Math.random()-.5)*r*1.7,Y=py+(Math.random()-.4)*r*.6,Z=r*(.5+Math.random()*.5),g=x.createRadialGradient(X,Y,0,X,Y,Z);g.addColorStop(0,'rgba('+q+',.96)');g.addColorStop(.55,'rgba('+q+',.8)');g.addColorStop(1,'rgba('+q+',0)');x.fillStyle=g;x.beginPath();x.arc(X,Y,Z,0,6.3);x.fill()}};
const sk=(n,q)=>{for(let i=0;i<n;i++){const y=540+Math.random()*470,p=Math.random()*2048,l=15+Math.random()*90,h=.7+Math.random()*.6;x.strokeStyle='rgba('+((q[0]*h)|0)+','+((q[1]*h)|0)+','+((q[2]*h)|0)+',.35)';x.lineWidth=1+Math.random()*2.5;x.beginPath();x.moveTo(p,y);x.lineTo(p+l,y);x.stroke()}};
const sp=(n,a,b,y0,y1)=>{for(let i=0;i<n;i++){x.fillStyle='rgba(255,255,255,'+(a+Math.random()*(b-a))+')';x.fillRect(Math.random()*2048,y0+Math.random()*(y1-y0),1.4,1.4)}};
if(k=='meadow'){gr([[0,'#2b64c9'],[.3,'#79b0e9'],[.49,'#dceef9'],[.51,'#7cb45a'],[.75,'#4a9436'],[1,'#2a6a1e']]);gl(1430,265,150,'rgba(255,253,240,1)','rgba(255,246,214,.9)');CL.forEach(([a,b,r])=>cl(a,b,r,'255,255,255'));sk(400,[46,148,50])}
else if(k=='sunset'){gr([[0,'#1b2455'],[.28,'#5c3a75'],[.44,'#d96a3b'],[.495,'#ffd9a0'],[.51,'#37502a'],[.8,'#23361b'],[1,'#182612']]);gl(1024,480,280,'rgba(255,238,205,1)','rgba(255,150,80,.85)');x.fillStyle='rgba(255,244,220,1)';x.beginPath();x.arc(1024,488,38,0,6.3);x.fill();CL.forEach(([a,b,r])=>cl(a*.9,b,r*.9,'255,175,125'));sk(350,[44,72,38])}
else if(k=='night'){gr([[0,'#02030a'],[.35,'#0a1230'],[.49,'#141f37'],[.51,'#0a0d10'],[1,'#05070a']]);sp(430,.2,1,0,480);gl(500,210,95,'rgba(238,244,255,1)','rgba(190,205,255,.8)');x.fillStyle='rgba(235,240,255,1)';x.beginPath();x.arc(500,210,20,0,6.3);x.fill();sk(240,[24,34,48])}
else if(k=='studio'){gr([[0,'#141417'],[.5,'#25262b'],[1,'#0d0e10']]);const sf=(px,py,w,h,v)=>{const g=v?x.createLinearGradient(px-w/2,0,px+w/2,0):x.createLinearGradient(0,py-h,0,py+h);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(px-w/2,py-h,w,2*h)};sf(1024,210,760,22);sf(330,340,56,190,1);sf(1720,340,56,190,1);sf(1300,470,520,10);sk(180,[96,98,104])}
else{gr([[0,'#5f88bd'],[.3,'#a9c8e4'],[.49,'#eef5fa'],[.51,'#e2ebf2'],[.75,'#c8d6e0'],[1,'#a9bcc9']]);gl(1600,250,140,'rgba(255,255,255,1)','rgba(228,240,250,.85)');CL.forEach(([a,b,r])=>cl(a,b,r,'248,250,255'));sp(260,.3,1,540,1010);sk(150,[168,182,198])}
return c}
let env=null;
function setEnv(k){if(env)env.dispose();env=new THREE.CanvasTexture(paint(k));env.mapping=THREE.EquirectangularReflectionMapping;env.colorSpace=THREE.SRGBColorSpace;S.environment=env}
setEnv('meadow');
const mat=new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:P.rough,envMapIntensity:1.4});
const RES=small?56:80,PER=.13,SX=1.75,SY=1.25,SZ=1.15;
let SUB=12,bob=.12;
const ef=new MarchingCubes(RES,mat,false,false,100000);
ef.scale.set(SX,SY,SZ);ef.position.y=bob;ef.frustumCulled=false;S.add(ef);
const rad=b=>Math.sqrt(b.s/(80+SUB));
const cg=(v,rm,r)=>{let lo=.5-rm+r,hi2=.5+rm-r;if(lo>hi2)return .5;return Math.min(Math.max(v,Math.max(lo,.02)),Math.min(hi2,.98))};
const rb=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),new THREE.LineBasicMaterial({color:0x5a7aa0,transparent:true,opacity:.55}));
rb.visible=false;S.add(rb);
const roomUpd=()=>{rb.scale.set(P.rx*2*SX,P.ry*2*SY,P.rz*2*SZ)};
roomUpd();
const clampB=b=>{const r=rad(b);b.pos.set(cg(b.pos.x,P.rx,r),cg(b.pos.y,P.ry,r),cg(b.pos.z,P.rz,r))};

/* шары */
let B=[],sel=-1;
function addBall(x,y,z,s){const b={s,ph:[Math.random()*6.28,Math.random()*6.28,Math.random()*6.28],pos:new THREE.Vector3(x,y,z),vel:new THREE.Vector3()};b.a=[x,y,z];clampB(b);B.push(b);sel=B.length-1;sz.value=s;return b}
function makeCloud(n){B=[];sel=-1;
const bs=Math.max(3,Math.round(n*.45)),tp=Math.max(0,n-bs-Math.round((n-bs)*.55)),md=n-bs-tp;
const fr=v=>v-Math.floor(v),rd=(i,k)=>fr(Math.sin(i*127.1+k*311.7)*43758.5453);
for(let i=0;i<bs;i++){const f=bs==1?.5:i/(bs-1);addBall(.3+.4*f,.435+(rd(i,4)-.5)*.02,.5+(rd(i,5)-.5)*.08,2.5-1.1*Math.abs(f-.5)*2)}
for(let i=0;i<md;i++){const f=md==1?.5:i/(md-1);addBall(.36+.28*f,.545+(rd(i,6)-.5)*.02,.5+(rd(i,7)-.5)*.1,1.5-.4*Math.abs(f-.5)*2)}
for(let i=0;i<tp;i++)addBall(.42+.16*(tp==1?.5:i/(tp-1)),.635-i*.015,.5+(rd(i,8)-.5)*.06,.85-.12*i);
sel=-1}
makeCloud(12);

/* маркер выбранного шара */
const giz=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),new THREE.MeshBasicMaterial({color:0x6fb4ff,wireframe:true,transparent:true,opacity:.8}));
giz.visible=false;S.add(giz);

function phys(dt){
for(const b of B){
b.vel.x+=(b.a[0]+.006*Math.sin(.21*st+b.ph[0])-b.pos.x)*P.back*dt;
b.vel.y+=(b.a[1]+.022*Math.sin(PER*st-9*b.a[0]+b.ph[1])-b.pos.y)*P.back*dt;
b.vel.z+=(b.a[2]+.009*Math.sin(.17*st+b.ph[2])-b.pos.z)*P.back*dt;
b.vel.multiplyScalar(Math.exp(-1.5*dt));
const v=b.vel.length();if(v>1.1)b.vel.multiplyScalar(1.1/v);
b.pos.addScaledVector(b.vel,dt);clampB(b)}}
function field(){
ef.reset();
for(const b of B){
const s=playing?b.s*(1+P.wave*Math.sin(PER*st-9*b.a[0]+.6*b.a[2]))*(1+.05*Math.sin(.09*st+b.ph[0])):b.s;
ef.addBall(b.pos.x,b.pos.y,b.pos.z,s,SUB)}
ef.update()}

/* кольца, пыль, свет */
const rg=[];
[[1.6,.4,-.18,.5,.09],[1.85,-.52,.3,.35,-.06],[2.05,1,.18,.22,.04]].forEach(([r,tx,tz,o,sp])=>{
const l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.EllipseCurve(0,0,r,r).getPoints(160)),new THREE.LineBasicMaterial({color:0xc9d2da,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));
l.rotation.x=Math.PI/2;const g=new THREE.Group();g.add(l);g.rotation.set(tx,Math.random()*6.28,tz);g.position.copy(CT);g.userData.sp=sp;S.add(g);rg.push(g)});
const dp=new Float32Array(660);
for(let i=0;i<220;i++){const r=2.4+Math.random()*2.6,t=Math.random()*6.28,p=Math.acos(2*Math.random()-1);dp[i*3]=r*Math.sin(p)*Math.cos(t);dp[i*3+1]=r*Math.cos(p)*.6;dp[i*3+2]=r*Math.sin(p)*Math.sin(t)}
const dgp=new THREE.BufferGeometry();dgp.setAttribute('position',new THREE.BufferAttribute(dp,3));
const du=new THREE.Points(dgp,new THREE.PointsMaterial({color:0x9aa7b5,size:.02,transparent:true,opacity:.35,depthWrite:false}));S.add(du);
const key=new THREE.DirectionalLight(0xfff3dc,2.2);S.add(key);
const sl=new THREE.DirectionalLight(0x9fc4ff,.7);sl.position.set(-4,6,-6);S.add(sl);
const grl=new THREE.DirectionalLight(0x4c8f35,.55);grl.position.set(0,-6,2);S.add(grl);

/* своя карта */
const fin=document.createElement('input');fin.type='file';fin.accept='image/*';fin.style.display='none';document.body.appendChild(fin);
fin.onchange=()=>{const f=fin.files[0];if(!f)return;const rd=new FileReader();
rd.onload=()=>new THREE.TextureLoader().load(rd.result,t=>{t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;if(env)env.dispose();env=t;S.environment=t;P.env='custom';envC.updateDisplay()},undefined,()=>msg('Не удалось прочитать изображение'));
rd.readAsDataURL(f);fin.value=''};

/* пресет */
const preset=()=>JSON.stringify({params:{goo:P.goo,spin:P.spin,env:P.env,morph:P.morph,wave:P.wave,rough:P.rough,yank:P.yank,back:P.back,rx:P.rx,ry:P.ry,rz:P.rz,room:P.room},balls:B.map(b=>({p:b.pos.toArray().map(v=>+v.toFixed(4)),s:+b.s.toFixed(3)}))});
function applyPreset(t){
try{
const o=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),q=o.params||{};
['goo','spin','morph','wave','rough','yank','back','rx','ry','rz'].forEach(k=>{if(typeof q[k]=='number')P[k]=q[k]});
if(typeof q.room=='boolean')P.room=q.room;
if(['meadow','sunset','night','studio','winter'].indexOf(q.env)>=0){P.env=q.env;setEnv(q.env)}
SUB=30-24*P.goo;mat.roughness=P.rough;roomUpd();
if(Array.isArray(o.balls)&&o.balls.length){
B=o.balls.filter(f=>Array.isArray(f.p)&&f.p.length==3).map(f=>{const b={s:typeof f.s=='number'?f.s:1,ph:[Math.random()*6.28,Math.random()*6.28,Math.random()*6.28],pos:new THREE.Vector3(f.p[0],f.p[1],f.p[2]),vel:new THREE.Vector3()};b.a=f.p.slice();clampB(b);return b})}
sel=-1;gui.controllersRecursive().forEach(c=>c.updateDisplay())
}catch(e){msg('Пресет не разобран: '+e.message)}}

/* панель */
const gui=new GUI({title:'ПАРАМЕТРЫ'});gui.domElement.style.width='262px';
const fE=gui.addFolder('Редактор шаров');
fE.add({f(){makeCloud(12)}},'f').name('→ Демо-облако');
fE.add({f(){B=[];sel=-1}},'f').name('→ Очистить');
fE.add(P,'goo',.1,1).name('Тянучесть').onChange(v=>SUB=30-24*v);
const fS=gui.addFolder('Симуляция');
fS.add(P,'spin',-.12,.12,.001).name('Вращение сцены');
fS.add(P,'morph',.2,3).name('Скорость морфинга');
fS.add(P,'wave',0,.5).name('Перистальтика');
fS.add(P,'yank',1,20).name('Сила рывка');
fS.add(P,'back',.3,4).name('Возврат в форму');
const fR=gui.addFolder('Комната');
fR.add(P,'rx',.08,.48).name('Размер X').onChange(()=>{roomUpd();B.forEach(clampB)});
fR.add(P,'ry',.08,.48).name('Размер Y').onChange(()=>{roomUpd();B.forEach(clampB)});
fR.add(P,'rz',.08,.48).name('Размер Z').onChange(()=>{roomUpd();B.forEach(clampB)});
fR.add(P,'room').name('Показать сетку');
const fV=gui.addFolder('Отражение');
const envC=fV.add(P,'env',{'Летний луг':'meadow','Закат':'sunset','Ночь':'night','Студия':'studio','Зима':'winter','Своя карта':'custom'}).name('Вариант').onChange(k=>{if(k!='custom')setEnv(k)});
fV.add(P,'rough',.02,.4).name('Шероховатость').onChange(v=>mat.roughness=v);
fV.add({f:()=>fin.click()},'f').name('→ Загрузить свою…');
gui.add({f(){prompt('Скопируйте пресет (Ctrl+C → Enter):',preset())}},'f').name('Экспорт пресета');
gui.add({f(){const t=prompt('Вставьте пресет и нажмите OK:');if(t)applyPreset(t)}},'f').name('Применить пресет');
if(small)gui.close();
if(window.OBLAKA_PRESET)applyPreset(JSON.stringify(window.OBLAKA_PRESET));

/* тулбар */
const $=id=>document.getElementById(id),sz=$('sz'),bP=$('bPlay');
 $('bAdd').onclick=()=>addBall(.5+(Math.random()-.5)*.24,.5+(Math.random()-.5)*.12,.5+(Math.random()-.5)*.24,+sz.value);
 $('bDel').onclick=()=>{if(sel>=0)B.splice(sel,1);else B.pop();sel=-1;giz.visible=false};
bP.onclick=()=>setPlay(!playing);
function setPlay(on){playing=on;bP.textContent=on?'■ СТОП':'▶ ПУСК';bP.classList.toggle('on',on);
for(const b of B){b.a=[b.pos.x,b.pos.y,b.pos.z];b.vel.set(0,0,0)}giz.visible=false}

/* мышь */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),lst=new THREE.Vector2();
const v1=new THREE.Vector3(),v2=new THREE.Vector3(),v3=new THREE.Vector3(),v4=new THREE.Vector3(),vd=new THREE.Vector3(),vg=new THREE.Vector3(),dv=new THREE.Vector3(),hi=new THREE.Vector3(),pl=new THREE.Plane();
const W=b=>v3.set((b.pos.x*2-1)*SX,(b.pos.y*2-1)*SY+bob,(b.pos.z*2-1)*SZ);
const setN=e=>ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
function hitBall(){let h=-1,bd=1e9;for(let i=0;i<B.length;i++){W(B[i]);const d=ray.ray.distanceToPoint(v3),wr=rad(B[i])*2*SX+.14;if(d<wr&&d<bd){bd=d;h=i}}return h}
let hv=false,pr=false,rot=false,yk=false,gb=-1;
R.domElement.addEventListener('pointerdown',e=>{
pr=true;setN(e);lst.copy(ndc);hv=true;ray.setFromCamera(ndc,C);
const h=hitBall();
if(h>=0){if(playing){yk=true}else{sel=h;gb=h;sz.value=B[h].s}}
else rot=true});
addEventListener('pointermove',e=>{
setN(e);if(!hv){lst.copy(ndc);hv=true;return}
const dx=ndc.x-lst.x,dy=ndc.y-lst.y;lst.copy(ndc);
if(Math.abs(dx)+Math.abs(dy)<1e-6)return;
ray.setFromCamera(ndc,C);
if(gb>=0){const b=B[gb];W(b);camera:{C.getWorldDirection(v4);pl.setFromNormalAndCoplanarPoint(v4,v3);if(ray.ray.intersectPlane(pl,hi)){const r=rad(b);b.pos.set(cg(hi.x/(2*SX)+.5,P.rx,r),cg((hi.y-bob)/(2*SY)+.5,P.ry,r),cg(hi.z/(2*SZ)+.5,P.rz,r))}}return}
if(rot){ca-=dx*2.6;cp=Math.min(1.35,Math.max(-.2,cp+dy*1.8));return}
if(!playing)return;
/* рывок шаров (сильно при нажатии, мягко при проводке) */
const ds=C.position.distanceTo(CT),vh=2*Math.tan(C.fov*Math.PI/360)*ds,vw=vh*C.aspect;
v1.setFromMatrixColumn(C.matrixWorld,0);v2.setFromMatrixColumn(C.matrixWorld,1);
vd.copy(v1).multiplyScalar(dx*vw*.5).addScaledVector(v2,dy*vh*.5);
vg.set(vd.x/(2*SX),vd.y/(2*SY),vd.z/(2*SZ));
const K=yk?P.yank:P.yank*.28,mv=vd.length();
for(const b of B){
W(b);const d=ray.ray.distanceToPoint(v3);if(d>.95)continue;
let w=1-d/.95;w*=w;b.vel.addScaledVector(vg,w*K);
ray.ray.closestPointToPoint(v3,v4);dv.copy(v3).sub(v4);
const L2=dv.length();
if(L2>1e-4){const k2=w*mv*(yk?.5:.18)/L2;b.vel.x+=k2*dv.x/(2*SX);b.vel.y+=k2*dv.y/(2*SY);b.vel.z+=k2*dv.z/(2*SZ)}}});
addEventListener('pointerup',()=>{pr=false;rot=false;yk=false;gb=-1});
addEventListener('pointercancel',()=>{pr=false;rot=false;yk=false;gb=-1});
R.domElement.addEventListener('dblclick',e=>{
setN(e);ray.setFromCamera(ndc,C);
if(!playing){if(hitBall()<0){C.getWorldDirection(v4);pl.setFromNormalAndCoplanarPoint(v4,CT);
if(ray.ray.intersectPlane(pl,hi))addBall(cg(hi.x/(2*SX)+.5,P.rx,.02),cg((hi.y-bob)/(2*SY)+.5,P.ry,.02),cg(hi.z/(2*SZ)+.5,P.rz,.02),+sz.value)}}
else for(const b of B){dv.set(b.pos.x-.5,b.pos.y-.52,b.pos.z-.5);const L2=dv.length();if(L2>1e-4)dv.multiplyScalar(1/L2);else dv.set(0,1,0);b.vel.addScaledVector(dv,.55);b.vel.y+=.28}});
R.domElement.addEventListener('wheel',e=>{cd=THREE.MathUtils.clamp(cd+e.deltaY*.004,3.8,9)},{passive:true});
sz.addEventListener('input',()=>{if(sel>=0&&B[sel])B[sel].s=+sz.value});

/* цикл */
const ck=new THREE.Clock();let ok2=false,st=0;
function go(){
requestAnimationFrame(go);
const dt=Math.min(ck.getDelta(),.05);
if(playing){st+=dt*P.morph;bob=.12+.035*Math.sin(st*.13);ca+=dt*P.spin;du.rotation.y=st*.012;
key.position.set(7*Math.cos(st*.1),6+1.5*Math.sin(st*.07),7*Math.sin(st*.1));phys(dt)}
else bob=.12;
ef.position.y=bob;rb.position.set(0,bob,0);rb.visible=P.room||!playing;
field();
rg.forEach(g=>g.rotation.y+=g.userData.sp*dt);
if(!playing&&sel>=0&&B[sel]){W(B[sel]);giz.position.copy(v3);const r=rad(B[sel])*2*SX*1.15;giz.scale.set(r,r,r);giz.visible=true}else giz.visible=false;
C.position.set(Math.sin(ca)*Math.cos(cp)*cd,CT.y+Math.sin(cp)*cd,Math.cos(ca)*Math.cos(cp)*cd);C.lookAt(CT);
R.render(S,C);
if(!ok2){ok2=true;window.ok=true;document.getElementById('e').style.display='none';R.domElement.classList.add('r')}}
go();
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
}
</script>
</body>
</html>
